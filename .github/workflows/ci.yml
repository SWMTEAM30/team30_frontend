name: Deploy to EC2

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            source ~/.bashrc
            export NEXT_PUBLIC_TFT_BACKEND_URL=${{ secrets.NEXT_PUBLIC_TFT_BACKEND_URL }}
            export NEXT_PUBLIC_AUTH_KAKAO_ID=${{ secrets.NEXT_PUBLIC_AUTH_KAKAO_ID }}
            export NEXT_PUBLIC_AUTH_KAKAO_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_AUTH_KAKAO_REDIRECT_URL }}
            set -e
            cd ${{ secrets.EC2_PROJECT_PATH }}
            git fetch origin main
            git reset --hard origin/main

            pnpm install
            pnpm run build
            pm2 reload the-first-take || pm2 start "pnpm run start" --name the-first-take
